[project]
name = "saos-compensation"
version = "0.1.0"
description = "Regression of compensation awards from Polish SAOS judgments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "morfeusz2>=1.99.15",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.optional-dependencies]
extraction = [
    "basal",
]
pytorch-macos = [
    "basal; sys_platform == 'darwin'",
    "torch>=2.11; sys_platform == 'darwin'",
]
pytorch-cuda-linux = [
    "basal; sys_platform == 'linux'",
    "torch>=2.11; sys_platform == 'linux'",
]
gemma = [
    "ollama>=0.6.3",
]

[dependency-groups]
dev = []
test = [
    { include-group = "dev" },
    "pytest>=9.1.1",
]

[tool.uv.sources]
basal = { url = "https://github.com/rkinas/basal/archive/refs/tags/v2.4.1.tar.gz" }

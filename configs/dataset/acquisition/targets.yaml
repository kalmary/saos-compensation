embedding:
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  revision: e8f8c211226b894fcb81acc59f3b34ba3efd5f42
  device: mps # cpu, mps or cuda.
  batch_size: 64
  max_length: 128 # Longer sentences use all token windows, without dropping the tail.
  minimum_cosine_similarity: 0.7 # Winning score must be strictly greater. If more than one is, highest score wins

  # Target and exclusion groups compete by similarity; shared stems enable target roles.
  candidate_keywords:
    judgment:
    - zasądz
    - nakaz
    - zobowiąz
    - orzek
    - orzecz
    request:
    - żąd
    - zażąd
    - domaga
    - wnos
    - wniós
    - wnies
    - wnieś
    - wnios
    - wzyw
    - wezw
    - dochodz
    prior_payment:
    - przyzna
    - wypłac
    - wypłat
    - otrzyma
    - dotychczas
    - likwidac
    - zapłaci
    - zaspokoj
    - zaspokoi
    procedural_costs:
    - proces
    - postępowan
    - sądow
    - apelac
    - kasac
    - opłat
    - zastępstw
    - pełnomocni
    - skarb
    - biegł
    - adwok
    - radc
    - komorn
    - egzekuc
    - zaliczk
    - spis
    other_payments:
    - odset
    - rent
    - grzywn
    mixed:
    - żąd
    - zażąd
    - dochodz
    - wnioskowan
    - uwzględni
    - uwzględnion
    - oddal
    - utrzyma
    - utrzym
    - cofn
    shared:
    - przyzna
    - roszcz
    - powództw
    - zapłat
    - zapłac
    - zadośćuczyn
    - odszkod

patterns:
  # Representative phrase templates for embedding-based sentence selection.
  # Keep distinct constructions, not inflection, word-order or ending variants.
  # Placeholders stand for source text; these are not regular expressions.
  # Exclusion groups compete with target roles before numeric parsing.
  judgment:
    - "zasądza od {defendant} na rzecz {claimant} kwotę {amount}"
    - "przyznaje {claimant} kwotę {amount}"
    - "nakazuje {defendant} zapłacić na rzecz {claimant} kwotę {amount}"
    - "zobowiązuje {defendant} do naprawienia szkody poprzez zapłatę kwoty {amount}"
    - "zmienia zaskarżony wyrok przez zastąpienie kwoty {previous_amount} kwotą {amount}"
    - "orzeka na rzecz {claimant} nawiązkę w wysokości {amount}"
    - "zasądza na rzecz każdego z powodów po {amount}"
    - "zasądza solidarnie od pozwanych na rzecz powoda {amount} tytułem zadośćuczynienia"
    - "zasądza od pozwanego na rzecz powódki {amount} tytułem zwrotu kosztów leczenia"
    - "zasądza od pozwanego na rzecz powodów łącznie {amount} tytułem odszkodowania"

  # A requested amount remains a request even when it equals the eventual award.
  request:
    - "powód wnosi o zasądzenie od {defendant} na rzecz {claimant} kwoty {amount}"
    - "żąda zapłaty kwoty {amount}"
    - "roszczenie objęte pozwem wynosi {amount}"
    - "rozszerza powództwo o kwotę {additional_amount}, do łącznej kwoty {amount}"
    - "podtrzymuje żądanie pozwu w wysokości {amount}"
    - "w apelacji domaga się zmiany wyroku i przyznania kwoty {amount}"
    - "wzywa do zapłaty kwoty {amount}"
    - "pełnomocnik powoda ostatecznie zażądał jako zadośćuczynienia sumy {amount}"
    - "w pozwie określono dochodzone świadczenie na {amount}"
    - "powód ograniczył żądanie do kwoty {amount}"
    - "powód dochodzi dopłaty {amount} ponad kwotę wypłaconą przez ubezpieczyciela"
    - "powódka wystąpiła z żądaniem zapłaty {amount} tytułem zwrotu kosztów leczenia"

  # These groups compete with target roles; their winners are not target amounts.
  prior_payment:
    - "ubezpieczyciel wypłacił poszkodowanemu {amount} w postępowaniu likwidacyjnym"
    - "przed wniesieniem pozwu pozwany zapłacił powodowi {amount}"
    - "na poczet należnego świadczenia powód otrzymał już {amount}"
    - "dotychczas przyznane przez pozwanego zadośćuczynienie wynosi {amount}"
    - "roszczenie zostało częściowo zaspokojone przez dobrowolną zapłatę {amount}"
    - "sąd ocenił dotychczasową wypłatę {amount} jako symboliczną i niewystarczającą"
    - "poszkodowany otrzymał łącznie z kilku wypłat kwotę {amount}"
    - "decyzją ubezpieczyciela przyznano i wypłacono poszkodowanemu {amount} przed procesem"
    - "w toku likwidacji szkody wypłacono zaliczkę na odszkodowanie w kwocie {amount}"
    - "sprawca zwrócił poszkodowanemu {amount} przed wniesieniem pozwu i częściowo zaspokoił roszczenie"

  procedural_costs:
    - "zasądza od pozwanego na rzecz powoda {amount} tytułem zwrotu kosztów procesu"
    - "powodowie wnieśli o zasądzenie {amount} tytułem zastępstwa procesowego"
    - "nakazuje pobrać na rzecz Skarbu Państwa {amount} nieuiszczonych kosztów sądowych"
    - "uiszczona opłata od pozwu wynosiła {amount}"
    - "przyznaje pełnomocnikowi z urzędu wynagrodzenie w wysokości {amount}"
    - "obciąża stronę wydatkami na opinię biegłego w kwocie {amount}"
    - "strona przegrywająca zwróci przeciwnikowi {amount} kosztów postępowania apelacyjnego"
    - "komornik ustalił koszty postępowania egzekucyjnego na {amount}"
    - "zwraca stronie niewykorzystaną zaliczkę na wydatki sądowe w kwocie {amount}"
    - "kwotę {amount} sąd zasądził zgodnie z przedstawionym spisem kosztów"
    - "odstępuje od obciążania powoda kosztami procesu w wysokości {amount}"
    - "zasądza od powoda na rzecz pozwanego {amount} tytułem kosztów zastępstwa procesowego"
    - "nakazuje zwrócić ze Skarbu Państwa powodowi nadpłaconą opłatę sądową w wysokości {amount}"
    - "zasądza od pozwanego na rzecz świadka {amount} tytułem zwrotu kosztów stawiennictwa w postępowaniu"

  mixed:
    - "powód żądał {previous_amount}, lecz sąd zasądził tylko {amount}"
    - "z dochodzonej kwoty {previous_amount} uwzględniono powództwo co do {amount}"
    - "powód utrzymał się z żądaniem do kwoty {amount}, a w pozostałej części powództwo oddalono"
    - "sąd obniżył żądaną sumę {previous_amount} do należnego zadośćuczynienia {amount}"
    - "w miejsce wnioskowanych {previous_amount} przyznano poszkodowanemu {amount}"
    - "oddala w całości żądanie zapłaty kwoty {amount}"
    - "oddala powództwo co do kwoty {amount} jako bezzasadne"
    - "umarza postępowanie co do kwoty {amount} wskutek cofnięcia powództwa"
    - "utrzymuje w mocy wyrok zasądzający kwotę {amount}"
    - "pozwany wniósł o oddalenie powództwa o zapłatę {amount}"

  # Non-principal payments outside the selected one-off compensation targets.
  other_payments:
    - "skapitalizowane odsetki za opóźnienie wynoszą {amount}"
    - "od kwoty głównej naliczono {amount} odsetek ustawowych"
    - "zasądza rentę w wysokości {amount} miesięcznie płatną do dziesiątego dnia miesiąca"
    - "zaległe raty renty za wskazany okres wynoszą łącznie {amount}"
    - "wymierza karę grzywny w wysokości {amount}"
    - "ustala wysokość jednej stawki dziennej grzywny na kwotę {amount}"
    - "zasądza od pozwanego {amount} tytułem odsetek za okres opóźnienia"
    - "zasądza rentę skapitalizowaną za poprzedni okres w kwocie {amount}"
    - "umarza orzeczoną grzywnę w pozostałej kwocie {amount}"

model: Remek/basal-2.0-mini
# cpu, mps (Apple GPU), or cuda (NVIDIA GPU).
device: mps

feature_fields:
- judgment_year
- instance
- court_locality_size # Population class of the locality where the court is located (GUGiK).
- event_circumstances
- harm_type
- harm_severity_duration
- life_impact
- claimant_circumstances
- treatment_assistance

# Awarded principal components, excluding costs, interest and periodic rent.
target_fields:
- zadoscuczynienie
- pozostale_odszkodowanie

# Minimum probability for factual passages and procedural instance.
minimum_probability: 0.6

# Maximum leakage probability; lower values are stricter.
maximum_leak_probability: 0.2

# Minimum probability for amount assignment and final award confirmation.
amount_minimum_probability: 0.6

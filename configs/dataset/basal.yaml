model: Remek/basal-2.0-4.5B
# cpu, mps (Apple GPU), or cuda (NVIDIA GPU).
device: mps

feature_fields:
- judgment_year
- instance
- prior_payment # Earlier principal paid in PLN, rounded to int; 0 without confirmation.
- injured_party_count # People receiving compensation in this judgment.
- court_locality_size # Population class of the locality where the court is located (GUGiK).
- event_description
- harm_description
- harm_duration
- practical_impact
- claimant_context
- remedial_actions

# One case-level principal total, excluding costs, interest, rent and earlier payments.
target_fields:
- total

# Minimum probability for factual passages and procedural instance.
minimum_probability: 0.6

# Maximum leakage probability; lower values are stricter.
maximum_leak_probability: 0.2

# Minimum probability for amount assignment and final award confirmation.
amount_minimum_probability: 0.6
